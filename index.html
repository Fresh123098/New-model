<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fresh and Clean Laundry — SaaS POS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0f172a;
  --primary-blue: #2563eb;
  --primary-blue-hover: #1d4ed8;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --success: #10b981;
  --success-dark: #059669;
  --danger: #ef4444;
  --danger-bg: #fee2e2;
  --warning: #f59e0b;
  --sidebar-bg: #0f172a;
  --sidebar-text: #94a3b8;
  --sidebar-hover: #1e293b;
  --radius: 8px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --header-height: 64px;
  --sidebar-width: 260px;
}

[data-theme="dark"] {
  --primary: #0f172a;
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --border: #334155;
  --sidebar-bg: #020617;
  --sidebar-hover: #1e293b;
  --danger-bg: rgba(239, 68, 68, 0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font-family: 'Inter', sans-serif; font-size: 14px; color: inherit; }
button { cursor: pointer; border: none; background: none; outline: none; transition: all 0.15s; }
.hide { display: none !important; }

/* ===== LOGIN ===== */
.login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--sidebar-bg); overflow-y: auto; }
.login-box { background: var(--card); border-radius: 12px; padding: 40px 32px; width: 100%; max-width: 380px; box-shadow: var(--shadow-md); text-align: center; border: 1px solid var(--border); }
.login-box h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.login-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
.pin-input { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 24px; text-align: center; letter-spacing: 8px; font-weight: 600; color: var(--text); margin-bottom: 20px; background: var(--bg); transition: 0.2s; outline: none; }
.pin-input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
.btn-login { width: 100%; padding: 14px; border-radius: 8px; background: var(--primary-blue); color: #fff; font-size: 15px; font-weight: 600; }
.btn-login:hover { background: var(--primary-blue-hover); }

/* ===== LAYOUT (SaaS STYLE) ===== */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: transform 0.2s ease; z-index: 100; flex-shrink: 0; }
.brand { height: var(--header-height); padding: 0 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--sidebar-hover); }
.brand-info h2 { font-size: 14.5px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;}
.brand-info span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.nav-menu { padding: 16px 12px; flex: 1; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 6px; color: var(--sidebar-text); font-weight: 500; margin-bottom: 4px; cursor: pointer; font-size: 13.5px; }
.nav-item:hover { background: var(--sidebar-hover); color: #fff; }
.nav-item.active { background: var(--primary-blue); color: #fff; font-weight: 600; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--sidebar-hover); font-size: 12px; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { height: var(--header-height); background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar h1 { font-size: 18px; font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 12px; }

.role-toggle { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 4px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; }
.role-toggle span { padding: 4px 10px; border-radius: 4px; color: var(--text-muted); }
.role-toggle.staff span.staff-lbl { background: var(--warning); color: #fff; }
.role-toggle.staff span.admin-lbl { color: var(--text-muted); background: transparent; }
.role-toggle:not(.staff) span.admin-lbl { background: var(--primary-blue); color: #fff; }
.role-toggle:not(.staff) span.staff-lbl { color: var(--text-muted); background: transparent; }

.theme-toggle, .mobile-menu { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text-muted); cursor: pointer; border: 1px solid var(--border); }
.theme-toggle:hover { background: var(--border); }
.mobile-menu { display: none; }

.content { flex: 1; overflow-y: auto; padding: 24px; position: relative; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }

/* ===== BUTTONS ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 6px; font-weight: 500; font-size: 13.5px; }
.btn-primary { background: var(--primary-blue); color: #fff; }
.btn-primary:hover { background: var(--primary-blue-hover); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: var(--success-dark); }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg); }
.btn-danger { background: var(--danger-bg); color: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 4px; }
.btn-icon { width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
.btn-icon:hover { background: var(--border); color: var(--text); }

/* ===== STATS & TABLES ===== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--card); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
.stat-icon { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.stat-card.purple .stat-icon { background: rgba(37, 99, 235, 0.1); color: var(--primary-blue); }
.stat-card.green .stat-icon { background: rgba(16, 185, 129, 0.1); color: var(--success); }
.stat-card.orange .stat-icon { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
.stat-card.cyan .stat-icon { background: rgba(6, 182, 212, 0.1); color: #06b6d4; }
.stat-info h3 { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
.stat-info h2 { font-size: 20px; font-weight: 700; color: var(--text); }

.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 24px; overflow: hidden; display: flex; flex-direction: column; }
.card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; flex-shrink: 0; }
.card-header h2 { font-size: 15px; font-weight: 600; }
.card-body { padding: 20px; }

.table-responsive { overflow: auto; flex: 1; max-height: 500px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 12px 16px; background: var(--bg); color: var(--text-muted); font-size: 11px; font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:hover { background: var(--bg); }

.badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
.badge.paid { background: #d1fae5; color: #065f46; }
.badge.unpaid { background: #fee2e2; color: #991b1b; }
.badge.pending { background: #fef3c7; color: #92400e; }

/* ===== POS (LAPTOP LAYOUT) ===== */
.pos-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; height: calc(100vh - 112px); }
.pos-panel { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.pos-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
.search-bar { flex: 1; position: relative; }
.search-bar input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--border); border-radius: 6px; font-size: 13.5px; background: var(--bg); outline: none; }
.search-bar input:focus { border-color: var(--primary-blue); background: var(--card); }
.search-bar span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

.items-grid { padding: 16px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; flex: 1; align-content: start; }
.item-card-btn { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; transition: 0.15s; }
.item-card-btn:hover { border-color: var(--primary-blue); background: var(--bg); }
.item-img { width: 100%; height: 60px; border-radius: 6px; object-fit: cover; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); }
.item-card-btn h4 { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.item-card-btn p { font-size: 10px; color: var(--text-muted); }
.item-card-btn span { font-size: 13px; font-weight: 700; color: var(--primary-blue); margin-top: auto; }

.cart-items { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.empty-cart { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
.cart-item { background: var(--bg); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); }
.cart-item-top { display: flex; justify-content: space-between; align-items: center; }
.cart-item-title { font-weight: 600; font-size: 13.5px; }
.cart-item-remove { color: var(--danger); width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
.cart-item-remove:hover { background: var(--danger-bg); }
.cart-item-controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr auto; gap: 8px; align-items: center; }
.cart-item-controls select, .cart-item-controls input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; font-weight: 500; outline: none; background: var(--card); width: 100%; }
.cart-item-total { font-weight: 700; font-size: 13.5px; text-align: right; white-space: nowrap; }

.cart-summary { padding: 16px; border-top: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
.summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 500; }
.summary-row input { width: 80px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; text-align: right; font-weight: 600; outline: none; }
.summary-row.total { border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 12px; font-size: 16px; font-weight: 700; }
.summary-row.total span:last-child { color: var(--primary-blue); }
.pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; margin-bottom: 12px; }
.action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.action-buttons .btn { width: 100%; padding: 12px; }

/* ===== FORMS ===== */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 11.5px; font-weight: 600; color: var(--text-muted); }
.field input, .field select, .field textarea { padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 13.5px; outline: none; width: 100%; }
.field input:focus { border-color: var(--primary-blue); background: var(--card); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ===== MODAL ===== */
.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; }
.modal.active { display: flex; }
.modal-content { background: var(--card); border-radius: 10px; width: 100%; max-width: 480px; box-shadow: var(--shadow-md); overflow: hidden; border: 1px solid var(--border); }
.modal-content.wide { max-width: 750px; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { width: 28px; height: 28px; border-radius: 6px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
.modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: var(--bg); }

/* ===== INVOICE ===== */
.invoice-print { background: #fff; padding: 40px; font-size: 13px; color: #0f172a; max-width: 800px; margin: 0 auto; border: 1px solid #e2e8f0; }
.inv-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #0f172a; padding-bottom: 20px; margin-bottom: 24px; }
.inv-logo img { height: 60px; }
.inv-title { text-align: right; }
.inv-title h1 { font-size: 28px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
.inv-title p { font-size: 13px; color: #64748b; }
.inv-details { display: flex; justify-content: space-between; margin-bottom: 24px; }
.inv-details .lbl { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
.inv-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
.inv-table th { background: #f8fafc; padding: 10px; text-align: left; font-size: 11px; border-bottom: 1px solid #e2e8f0; }
.inv-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
.inv-totals { display: flex; justify-content: flex-end; }
.inv-totals-box { width: 280px; }
.inv-totals-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; color: #64748b; }
.inv-totals-row.grand { border-top: 2px solid #0f172a; padding-top: 10px; margin-top: 6px; font-size: 16px; font-weight: 700; color: #0f172a; }
.inv-footer { text-align: center; margin-top: 30px; padding-top: 16px; border-top: 1px solid #e2e8f0; color: #64748b; font-size: 12px; }

/* ===== TOAST ===== */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--text); color: #fff; padding: 12px 20px; border-radius: 6px; font-weight: 500; font-size: 13.5px; box-shadow: var(--shadow-md); animation: slideIn 0.2s ease; }
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
  .pos-layout { display: flex; flex-direction: column; height: auto; }
  .pos-panel { height: 500px; }
}
@media (max-width: 768px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { height: auto; }
  .mobile-menu { display: flex; }
  .overlay.active { display: block; }
  .content { padding: 16px; overflow: visible; }
  .pos-layout { height: auto; }
  .pos-panel { height: auto; max-height: 600px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .role-toggle { display: none; } /* Hide role toggle on mobile to save space */
}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>Fresh & Clean POS</h1>
    <p>Enter your PIN to access</p>
    <input type="text" id="pinInput" class="pin-input" value="0000" maxlength="4" autocomplete="off">
    <button class="btn-login" onclick="handleLogin()">Login</button>
    <p style="margin-top: 16px; font-size: 11px;">Master PIN: 0000</p>
  </div>
</div>

<div id="app" class="app" style="display: none;">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div id="sidebarLogo" style="width: 32px; height: 32px; border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: center;">
        <span style="font-weight: 700; color: var(--primary-blue); font-size: 11px;">F&C</span>
      </div>
      <div class="brand-info">
        <h2 id="sidebarShopName">Fresh & Clean</h2>
        <span>SaaS POS</span>
      </div>
    </div>
    <nav class="nav-menu" id="navMenu">
      <div class="nav-item active" data-view="dashboard" data-role="admin" onclick="navTo('dashboard')"><span class="icon">📊</span> Dashboard</div>
      <div class="nav-item" data-view="pos" data-role="all" onclick="navTo('pos')"><span class="icon">🛒</span> New Bill</div>
      <div class="nav-item" data-view="orders" data-role="all" onclick="navTo('orders')"><span class="icon">📋</span> Invoices</div>
      <div class="nav-item" data-view="items" data-role="all" onclick="navTo('items')"><span class="icon">👕</span> Items</div>
      <div class="nav-item" data-view="customers" data-role="all" onclick="navTo('customers')"><span class="icon">👥</span> Customers</div>
      <div class="nav-item" data-view="expenses" data-role="admin" onclick="navTo('expenses')"><span class="icon">💸</span> Expenses</div>
      <div class="nav-item" data-view="reports" data-role="admin" onclick="navTo('reports')"><span class="icon">📈</span> Reports</div>
      <div class="nav-item" data-view="settings" data-role="admin" onclick="navTo('settings')"><span class="icon">⚙️</span> Settings</div>
    </nav>
    <div class="sidebar-footer">
      <div style="margin-bottom: 8px;">v5.0 SaaS</div>
      <button onclick="handleLogout()" style="color: var(--danger); font-size: 12px; font-weight: 600;">Logout</button>
    </div>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <!-- Role Switcher -->
        <div class="role-toggle" id="roleToggle" onclick="toggleRole()">
          <span class="admin-lbl">Admin</span>
          <span class="staff-lbl">Staff</span>
        </div>
        <div class="theme-toggle" onclick="toggleTheme()">🌙</div>
        <button class="btn btn-primary btn-sm" onclick="navTo('pos')">+ New Bill</button>
      </div>
    </header>

    <div class="content">
      <div id="view-dashboard" class="view"></div>
      <div id="view-pos" class="view hide"></div>
      <div id="view-orders" class="view hide"></div>
      <div id="view-items" class="view hide"></div>
      <div id="view-customers" class="view hide"></div>
      <div id="view-expenses" class="view hide"></div>
      <div id="view-reports" class="view hide"></div>
      <div id="view-settings" class="view hide"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content" id="modalBox"></div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div id="printArea" style="display:none;"></div>
<input type="file" id="globalLogoUpload" accept="image/*" style="display: none;" onchange="uploadLogo(this)">
<input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(this)">

<script>
var STORAGE_KEY = 'fcl_laundry_saas_v6';
var THEME_KEY = 'fcl_theme';

var savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  var tb = document.querySelector('.theme-toggle'); if(tb) tb.textContent = '☀️';
}

var DEFAULT_SETTINGS = {
  shopName: 'Fresh and Clean Laundry',
  phone: '+973 3300 0000',
  address: 'Manama, Bahrain',
  currency: 'BHD',
  pin: '1234',
  logo: '',
  invoicePrefix: 'FCL-',
  nextInvoiceNo: 1,
  receiptType: 'a4',
  role: 'admin' // 'admin' or 'staff'
};

var DEFAULT_ITEMS = [
  { name: 'Shirt', ar: 'قميص', wash: 0.500, iron: 0.300, dry: 1.000, img: '' },
  { name: 'T-Shirt', ar: 'تي شيرت', wash: 0.400, iron: 0.250, dry: 0.800, img: '' },
  { name: 'Trousers', ar: 'بنطال', wash: 0.600, iron: 0.300, dry: 1.000, img: '' },
  { name: 'Jeans', ar: 'جينز', wash: 0.700, iron: 0.400, dry: 1.200, img: '' },
  { name: 'Suit', ar: 'بدلة', wash: 2.000, iron: 1.000, dry: 3.000, img: '' },
  { name: 'Abaya', ar: 'عباية', wash: 1.000, iron: 0.500, dry: 1.500, img: '' },
  { name: 'Dishdasha', ar: 'دشداشة', wash: 0.800, iron: 0.400, dry: 1.200, img: '' },

var state = loadState();
var cart = [];
var currentCustomer = null;
var curView = 'dashboard';

function loadState() {
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed.settings && parsed.items) {
        parsed.settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings);
        if(!parsed.expenses) parsed.expenses = [];
        return parsed;
      }
    }
  } catch (e) {}
  
  var initial = { settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), items: [], customers: [], orders: [], expenses: [] };
  for(var i=0; i<DEFAULT_ITEMS.length; i++) { var it = DEFAULT_ITEMS[i]; it.id = generateId(); initial.items.push(it); }
  
  var c1 = { id: generateId(), name: 'Ahmed Al Khalifa', phone: '+973 3300 1111', address: 'Riffa' };
  initial.customers = [c1];
  initial.orders = [
    {
      id: generateId(), invNo: 'FCL-0001', customerId: c1.id, customerName: c1.name, customerPhone: c1.phone,
      items: [{ id: generateId(), itemId: initial.items[0].id, name: 'Shirt', service: 'Wash', qty: 3, price: 0.500 }],
      subtotal: 1.500, discount: 0, vatAmount: 0, total: 1.500, paid: 1.500, balance: 0,
      paymentMethod: 'Cash', status: 'Delivered', date: todayISO(), deliveryDate: todayISO()
    }
  ];
  initial.settings.nextInvoiceNo = 2;
  return initial;
}

function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function generateId() { return Math.random().toString(36).slice(2, 11); }
function formatMoney(amt) { return state.settings.currency + ' ' + Number(amt || 0).toFixed(3); }
function todayISO() { return new Date().toISOString().split('T')[0]; }

function showToast(msg, type) {
  type = type || 'success';
  var el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('toastContainer').appendChild(el);
  setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }, 3000);
}

function toggleTheme() {
  var html = document.documentElement;
  if (html.getAttribute('data-theme') === 'dark') {
    html.removeAttribute('data-theme'); localStorage.setItem(THEME_KEY, 'light'); document.querySelector('.theme-toggle').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'dark'); localStorage.setItem(THEME_KEY, 'dark'); document.querySelector('.theme-toggle').textContent = '☀️';
  }
}

/* ===== ROLE MANAGEMENT (SAAS FEATURE) ===== */
function toggleRole() {
  state.settings.role = state.settings.role === 'admin' ? 'staff' : 'admin';
  saveState();
  applyRole();
  showToast('Switched to ' + state.settings.role.toUpperCase() + ' mode');
}

function applyRole() {
  var isStaff = state.settings.role === 'staff';
  var roleToggle = $('roleToggle');
  if(isStaff) roleToggle.classList.add('staff'); else roleToggle.classList.remove('staff');

  var navs = document.querySelectorAll('.nav-item');
  for(var i=0; i<navs.length; i++) {
    var roleAttr = navs[i].getAttribute('data-role');
    if (isStaff && roleAttr === 'admin') {
      navs[i].style.display = 'none';
    } else {
      navs[i].style.display = 'flex';
    }
  }
  
  // Agar staff mode on hai aur woh kisi admin page par hai, toh usay POS par bhej dein
  if (isStaff && (curView === 'settings' || curView === 'reports' || curView === 'expenses' || curView === 'dashboard')) {
    navTo('pos');
  }
}

/* ===== LOGIN & INIT ===== */
function handleLogin() {
  var pin = $('pinInput').value.trim();
  if (pin === '0000' || pin === '1234' || state.settings.pin === pin) {
    $('loginScreen').style.display = 'none';
    $('app').style.display = 'flex';
    $('sidebarShopName').textContent = state.settings.shopName;
    applyRole();
    navTo(state.settings.role === 'admin' ? 'dashboard' : 'pos');
  } else {
    alert('Incorrect PIN');
  }
}
function handleLogout() { location.reload(); }
function toggleSidebar() { $('sidebar').classList.toggle('open'); $('overlay').classList.toggle('active'); }

/* ===== NAVIGATION ===== */
function navTo(view) {
  if (state.settings.role === 'staff' && (view === 'settings' || view === 'reports' || view === 'expenses' || view === 'dashboard')) {
    view = 'pos'; // Block staff from accessing admin pages
  }
  
  curView = view;
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  var activeNav = document.querySelector('.nav-item[data-view="' + view + '"]');
  if (activeNav) activeNav.classList.add('active');

  document.querySelectorAll('.view').forEach(function(v) { v.classList.add('hide'); });
  var targetView = $('view-' + view);
  if(targetView) targetView.classList.remove('hide');
  
  var titles = { dashboard: 'Dashboard', pos: 'New Bill (POS)', orders: 'Invoices', items: 'Items', customers: 'Customers', expenses: 'Expenses', reports: 'Reports', settings: 'Settings' };
  if(titles[view]) $('pageTitle').textContent = titles[view];
  
  if (window.innerWidth <= 768) toggleSidebar();

  if (view === 'dashboard') renderDashboard();
  if (view === 'pos') renderPOS();
  if (view === 'orders') renderOrders();
  if (view === 'items') renderItems();
  if (view === 'customers') renderCustomers();
  if (view === 'expenses') renderExpenses();
  if (view === 'reports') renderReports();
  if (view === 'settings') renderSettings();
}

function renderDashboard() {
  var today = todayISO();
  var todaySales = 0, todayOrders = 0, totalDue = 0;
  
  for(var i=0; i<state.orders.length; i++) {
    var o = state.orders[i];
    if(o.date === today && o.status !== 'Cancelled') { todaySales += o.total; todayOrders++; }
    totalDue += (o.balance || 0);
  }

  var recentHtml = '';
  var reversed = state.orders.slice().reverse().slice(0, 5);
  for(var i=0; i<reversed.length; i++) {
    var o = reversed[i];
    var stClass = o.status === 'Delivered' ? 'paid' : (o.status === 'Ready' ? 'pending' : 'unpaid');
    recentHtml += '<tr><td><strong>' + o.invNo + '</strong></td><td>' + o.customerName + '</td><td><strong>' + formatMoney(o.total) + '</strong></td><td><span class="badge ' + stClass + '">' + o.status + '</span></td><td><button class="btn-icon" onclick="viewInvoice(\'' + o.id + '\')">View</button></td></tr>';
  }
  if(recentHtml === '') recentHtml = '<tr><td colspan="5" style="text-align:center;">No invoices yet.</td></tr>';

      '<div class="stat-card green"><div class="stat-icon">🧾</div><div class="stat-info"><h3>Today\'s Orders</h3><h2>' + todayOrders + '</h2></div></div>' +
      '<div class="stat-card orange"><div class="stat-icon">⏳</div><div class="stat-info"><h3>Total Due</h3><h2>' + formatMoney(totalDue) + '</h2></div></div>' +
      '<div class="stat-card cyan"><div class="stat-icon">👥</div><div class="stat-info"><h3>Customers</h3><h2>' + state.customers.length + '</h2></div></div>' +
    '</div>' +
    '<div class="card"><div class="card-header"><h2>Recent Transactions</h2><button class="btn btn-secondary btn-sm" onclick="navTo(\'orders\')">View All</button></div>' +
    '<div class="table-responsive"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>' + recentHtml + '</tbody></table></div></div>';
}

function renderPOS() {
  var customerOptions = '<option value="">Walk-in Customer</option>';
  for(var i=0; i<state.customers.length; i++) { customerOptions += '<option value="' + state.customers[i].id + '">' + state.customers[i].name + ' (' + state.customers[i].phone + ')</option>'; }

  $('view-pos').innerHTML = 
    '<div class="pos-layout">' +
      '<div class="pos-panel">' +
        '<div class="pos-header"><div class="search-bar"><span>🔍</span><input type="text" id="posSearch" placeholder="Search items (F2 to focus)..." oninput="filterPOSItems()"></div></div>' +
        '<div class="items-grid" id="posItemsGrid"></div>' +
      '</div>' +
      '<div class="pos-panel">' +
        '<div class="pos-header" style="justify-content: space-between;"><h3 style="font-weight:600; font-size:14px;">Current Bill</h3><button class="btn btn-secondary btn-sm" onclick="clearCart()">Clear</button></div>' +
        '<div style="padding: 12px 16px; border-bottom: 1px solid var(--border);">' +
          '<div class="field" style="margin:0;"><label>Customer</label>' +

              '<button class="btn btn-secondary" onclick="openCustomerModal()">Add</button>' +
            '</div>' +
            '<div id="custBalanceDisplay" style="font-size: 12px; font-weight: 600; color: var(--danger); margin-top: 6px; display: none;"></div>' +
          '</div>' +
        '</div>' +
        '<div class="cart-items" id="posCartItems"></div>' +
        '<div class="cart-summary">' +
          '<div class="summary-row"><span>Subtotal</span><span id="posSubtotal">' + formatMoney(0) + '</span></div>' +
          '<div class="summary-row"><span>Discount</span><input type="number" id="posDiscount" value="0" min="0" step="0.001" oninput="calculatePOTotals()"></div>' +
          '<div class="summary-row total"><span>Total</span><span id="posTotal">' + formatMoney(0) + '</span></div>' +
          '<div class="pay-grid">' +
            '<div class="field" style="margin:0;"><label>Amount Paid</label><input type="number" id="posPaid" value="0" min="0" step="0.001" oninput="calculatePOTotals()"></div>' +
            '<div class="field" style="margin:0;"><label>Method</label><select id="posMethod"><option>Cash</option><option>BenefitPay</option><option>Other</option></select></div>' +
          '</div>' +
          '<div class="field" style="margin-bottom:8px;"><label>Order Status</label><select id="posOrderStatus"><option>Received</option><option>Washing</option><option>Ironing</option><option>Ready</option><option>Delivered</option></select></div>' +
          '<div class="summary-row" style="color: var(--danger); font-weight: 700;"><span>Balance Due</span><span id="posBalance">' + formatMoney(0) + '</span></div>' +
          '<div class="action-buttons" style="margin-top: 12px;">' +
            '<button class="btn btn-secondary" onclick="saveOrder(false, false)">Save</button>' +
            '<button class="btn btn-primary" onclick="saveOrder(true, false)">Save & Print</button>' +
            '<button class="btn btn-success" style="grid-column: 1/-1;" onclick="saveOrder(false, true)">Save & WhatsApp</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  renderPOSItems(''); renderCart();
}

function renderPOSItems(filter) {
  var items = state.items.filter(function(i) { return i.name.toLowerCase().indexOf(filter.toLowerCase()) !== -1; });
  var html = '';
  for(var i=0; i<items.length; i++) {
    var item = items[i];
    var price = item.wash > 0 ? item.wash : (item.iron > 0 ? item.iron : item.dry);
    var imgHtml = item.img ? '<img src="' + item.img + '" class="item-img">' : '<div class="item-img">👕</div>';
    html += '<button class="item-card-btn" onclick="addToCart(\'' + item.id + '\')">' + imgHtml + '<h4>' + item.name + '</h4><p>' + item.ar + '</p><span>' + formatMoney(price) + '</span></button>';
  }
  $('posItemsGrid').innerHTML = html;
}

function filterPOSItems() { renderPOSItems($('posSearch').value); }
function addToCart(itemId) {
  var item = null; for(var i=0; i<state.items.length; i++) { if(state.items[i].id === itemId) { item = state.items[i]; break; } }
  if (!item) return;
  var defaultService = item.wash > 0 ? 'Wash' : (item.iron > 0 ? 'Iron' : 'Dry Clean');
  cart.push({ id: generateId(), itemId: item.id, name: item.name, service: defaultService, qty: 1, price: getPriceForService(item, defaultService) });
  renderCart();
}
function getPriceForService(item, service) {
  if (service === 'Wash') return item.wash; if (service === 'Iron') return item.iron; if (service === 'Dry Clean') return item.dry; if (service === 'Wash & Iron') return item.wash + item.iron; return 0;
}
function renderCart() {
  var container = $('posCartItems');
  if (cart.length === 0) { container.innerHTML = '<div class="empty-cart"><span>🛒</span>Cart is empty.<br>Tap items to add.</div>'; calculatePOTotals(); return; }
  var html = '';
  for(var i=0; i<cart.length; i++) {
    var line = cart[i];
    html += '<div class="cart-item"><div class="cart-item-top"><div class="cart-item-title">' + line.name + '</div><button class="cart-item-remove" onclick="removeFromCart(\'' + line.id + '\')">✕</button></div><div class="cart-item-controls"><select onchange="updateCartLine(\'' + line.id + '\', \'service\', this.value)"><option value="Wash" ' + (line.service === 'Wash' ? 'selected' : '') + '>Wash</option><option value="Iron" ' + (line.service === 'Iron' ? 'selected' : '') + '>Iron</option><option value="Dry Clean" ' + (line.service === 'Dry Clean' ? 'selected' : '') + '>Dry Clean</option></select><input type="number" min="1" value="' + line.qty + '" onchange="updateCartLine(\'' + line.id + '\', \'qty\', this.value)"><input type="number" min="0" step="0.001" value="' + line.price + '" onchange="updateCartLine(\'' + line.id + '\', \'price\', this.value)"><div class="cart-item-total">' + formatMoney(line.qty * line.price) + '</div></div></div>';
  }
  container.innerHTML = html; calculatePOTotals();
}
function updateCartLine(id, field, value) {
  var line = null; for(var i=0; i<cart.length; i++) { if(cart[i].id === id) { line = cart[i]; break; } } if (!line) return;
  if (field === 'qty') line.qty = Math.max(1, parseFloat(value) || 1);
  if (field === 'price') line.price = Math.max(0, parseFloat(value) || 0);
  if (field === 'service') { line.service = value; var item = null; for(var i=0; i<state.items.length; i++) { if(state.items[i].id === line.itemId) { item = state.items[i]; break; } } line.price = getPriceForService(item, value); }
  renderCart();
}
function removeFromCart(id) { var newCart = []; for(var i=0; i<cart.length; i++) { if(cart[i].id !== id) newCart.push(cart[i]); } cart = newCart; renderCart(); }
function clearCart() { cart = []; $('posCustomer').value = ''; currentCustomer = null; $('custBalanceDisplay').style.display = 'none'; $('posDiscount').value = 0; $('posPaid').value = 0; renderCart(); }
function selectCustomer(id) {
  currentCustomer = null; var display = $('custBalanceDisplay'); if(!id) { display.style.display = 'none'; return; }
  for(var i=0; i<state.customers.length; i++) { if(state.customers[i].id === id) { currentCustomer = state.customers[i]; break; } }
  if(currentCustomer) {
    var totalDue = 0; for(var j=0; j<state.orders.length; j++) { if(state.orders[j].customerId === id) { totalDue += (state.orders[j].balance || 0); } }
    if(totalDue > 0) { display.textContent = 'Previous Due: ' + formatMoney(totalDue); display.style.display = 'block'; } else { display.style.display = 'none'; }
  }
}
function calculatePOTotals() {
  var subtotal = 0; for(var i=0; i<cart.length; i++) subtotal += (cart[i].qty * cart[i].price);
  var discount = parseFloat($('posDiscount').value) || 0; var total = Math.max(0, subtotal - discount);
  var paid = parseFloat($('posPaid').value) || 0; var balance = Math.max(0, total - paid);
  $('posSubtotal').textContent = formatMoney(subtotal); $('posTotal').textContent = formatMoney(total); $('posBalance').textContent = formatMoney(balance);
}
function saveOrder(print, whatsapp) {
  if (cart.length === 0) return showToast('Please add items to the bill', 'error');
  var subtotal = 0; for(var i=0; i<cart.length; i++) subtotal += (cart[i].qty * cart[i].price);
  var discount = parseFloat($('posDiscount').value) || 0; var total = Math.max(0, subtotal - discount);
  var paid = parseFloat($('posPaid').value) || 0; var balance = Math.max(0, total - paid);
  
  var order = {
    id: generateId(), invNo: state.settings.invoicePrefix + String(state.settings.nextInvoiceNo).padStart(4, '0'),
    customerId: currentCustomer ? currentCustomer.id : 'walk-in', customerName: currentCustomer ? currentCustomer.name : 'Walk-in Customer', customerPhone: currentCustomer ? currentCustomer.phone : '',
    items: cart.slice(), subtotal: subtotal, discount: discount, vatAmount: 0, total: total, paid: paid, balance: balance,
    paymentMethod: $('posMethod').value, status: $('posOrderStatus').value, date: todayISO(), deliveryDate: todayISO()
  };

  state.orders.push(order); state.settings.nextInvoiceNo++; saveState(); clearCart();
  if (whatsapp) showWhatsAppSuccess(order); else if (print) viewInvoice(order.id, true); else navTo('orders');
}

function showWhatsAppSuccess(order) {
  $('modalBox').className = 'modal-content';
  $('modalBox').innerHTML = '<div class="modal-header" style="border-bottom:none; padding-bottom:0;"><h3 style="color:var(--success);">✓ Bill Saved</h3><button class="modal-close" onclick="closeModal(); navTo(\'orders\')">✕</button></div><div class="modal-body" style="text-align:center; padding: 30px 20px;"><p style="margin-bottom: 20px;">Send invoice to <b>' + order.customerName + '</b> via WhatsApp.</p><button class="btn btn-success" style="width: 100%; padding: 14px;" onclick="triggerWhatsApp(\'' + order.id + '\')">Open WhatsApp</button></div>';
  $('modal').classList.add('active');
}
function triggerWhatsApp(id) {
  var order = null; for(var i=0; i<state.orders.length; i++) { if(state.orders[i].id === id) { order = state.orders[i]; break; } }
  if (!order || !order.customerPhone) { showToast('No phone number', 'error'); return; }
  var phone = order.customerPhone.replace(/\D/g, ''); if (phone.indexOf('973') !== 0) phone = '973' + phone.replace(/^0+/, '');
  var itemsText = ''; for(var i=0; i<order.items.length; i++) { var it = order.items[i]; itemsText += '- ' + it.name + ' (' + it.service + ') x' + it.qty + ' = ' + formatMoney(it.qty * it.price) + '\n'; }
  var message = '*' + state.settings.shopName + '*\nInvoice: *' + order.invNo + '*\nDate: ' + order.date + '\nCustomer: ' + order.customerName + '\n\n*Items:*\n' + itemsText + '\n*Total: ' + formatMoney(order.total) + '*\nPaid: ' + formatMoney(order.paid) + '\n*Balance: ' + formatMoney(order.balance) + '*\n\nThank you.';
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(message), '_blank'); closeModal(); navTo('orders');
}

/* ==========================================================================
   OTHER VIEWS (Orders, Items, Customers, Expenses, Reports, Settings)
   ========================================================================== */
function renderOrders(searchQuery) {
  var q = searchQuery || ''; var html = ''; var rev = state.orders.slice().reverse();
  for(var i=0; i<rev.length; i++) {
    var o = rev[i];
    if(q !== '' && (o.invNo + ' ' + o.customerName + ' ' + o.customerPhone).toLowerCase().indexOf(q.toLowerCase()) === -1) continue;
    var stClass = o.status === 'Delivered' ? 'paid' : (o.status === 'Ready' ? 'pending' : 'unpaid');
    var statusOptions = ''; var statuses = ['Received', 'Washing', 'Ironing', 'Ready', 'Delivered'];
    for(var k=0; k<statuses.length; k++) { statusOptions += '<option value="' + statuses[k] + '" ' + (o.status === statuses[k] ? 'selected' : '') + '>' + statuses[k] + '</option>'; }
    html += '<tr><td><strong>' + o.invNo + '</strong><br><small>' + o.date + '</small></td><td>' + o.customerName + '<br><small>' + (o.customerPhone || '') + '</small></td><td><strong>' + formatMoney(o.total) + '</strong><br><small style="color:var(--danger);">Bal: ' + formatMoney(o.balance) + '</small></td><td><select onchange="updateOrderStatus(\'' + o.id + '\', this.value)" style="padding:4px; border-radius:4px; font-size:11px;">' + statusOptions + '</select></td><td><div style="display:flex; gap:4px;"><button class="btn-icon" onclick="viewInvoice(\'' + o.id + '\')">👁</button><button class="btn-icon" style="color:var(--success);" onclick="showWhatsAppSuccess({id:\'' + o.id + '\', customerName:\'' + o.customerName + '\'})">💬</button><button class="btn-icon" style="color:var(--warning);" onclick="sendReadyAlert(\'' + o.id + '\')">🔔</button><button class="btn-icon" style="color:var(--danger);" onclick="deleteOrder(\'' + o.id + '\')">🗑</button></div></td></tr>';
  }
  if(html === '') html = '<tr><td colspan="5" style="text-align:center;">No invoices found.</td></tr>';
  $('view-orders').innerHTML = '<div class="card"><div class="card-header"><h2>Invoices</h2><input type="text" placeholder="Search Invoice/Name/Phone..." value="' + q + '" oninput="renderOrders(this.value)" style="padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); outline:none; width: 100%; max-width: 250px;"></div><div class="table-responsive"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>' + html + '</tbody></table></div></div>';
}

function updateOrderStatus(id, newStatus) { for(var i=0; i<state.orders.length; i++) { if(state.orders[i].id === id) { state.orders[i].status = newStatus; break; } } saveState(); showToast('Status updated'); }
function sendReadyAlert(id) {
  var order = null; for(var i=0; i<state.orders.length; i++) { if(state.orders[i].id === id) { order = state.orders[i]; break; } }
  if (!order || !order.customerPhone) { showToast('No phone number', 'error'); return; }
  var phone = order.customerPhone.replace(/\D/g, ''); if (phone.indexOf('973') !== 0) phone = '973' + phone.replace(/^0+/, '');
  var message = 'Hello ' + order.customerName + ',\n\nYour laundry is *READY*. You can collect your order ' + order.invNo + ' from ' + state.settings.shopName + '.\n\nThank you.';
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(message), '_blank');
}
function deleteOrder(id) { if (!confirm('Delete this invoice?')) return; var newOrders = []; for(var i=0; i<state.orders.length; i++) { if(state.orders[i].id !== id) newOrders.push(state.orders[i]); } state.orders = newOrders; saveState(); renderOrders(); showToast('Invoice deleted'); }

function viewInvoice(id, autoPrint) {
  var order = null; for(var i=0; i<state.orders.length; i++) { if(state.orders[i].id === id) { order = state.orders[i]; break; } }
  if (!order) return;
  var itemsHtml = ''; for(var i=0; i<order.items.length; i++) { var it = order.items[i]; itemsHtml += '<tr><td><strong>' + it.name + '</strong></td><td>' + it.service + '</td><td>' + it.qty + '</td><td>' + formatMoney(it.price) + '</td><td style="text-align:right;"><strong>' + formatMoney(it.qty * it.price) + '</strong></td></tr>'; }
  var logoHtml = state.settings.logo ? '<img src="' + state.settings.logo + '" style="height:60px;">' : '<h1 style="font-weight: 700; font-size: 24px;">Fresh & Clean</h1>';
  var html = '<div class="invoice-print"><div class="inv-header"><div class="inv-logo">' + logoHtml + '</div><div class="inv-title"><h1>INVOICE</h1><p>#' + order.invNo + '</p></div></div><div class="inv-details"><div><div class="lbl">Billed To</div><p><strong>' + order.customerName + '</strong></p><p>' + (order.customerPhone || '—') + '</p></div><div style="text-align:right;"><div class="lbl">Shop Details</div><p><strong>' + state.settings.shopName + '</strong></p><p>' + state.settings.address + '</p><p>' + state.settings.phone + '</p></div><div style="text-align:right;"><div class="lbl">Date</div><p>' + order.date + '</p><div class="lbl" style="margin-top:10px;">Status</div><p>' + order.status + '</p></div></div><table class="inv-table"><thead><tr><th>Item</th><th>Service</th><th>Qty</th><th>Price</th><th style="text-align:right;">Total</th></tr></thead><tbody>' + itemsHtml + '</tbody></table><div class="inv-totals"><div class="inv-totals-box"><div class="inv-totals-row"><span>Subtotal</span><span>' + formatMoney(order.subtotal) + '</span></div>' + (order.discount > 0 ? '<div class="inv-totals-row"><span>Discount</span><span>-' + formatMoney(order.discount) + '</span></div>' : '') + '<div class="inv-totals-row grand"><span>TOTAL</span><span>' + formatMoney(order.total) + '</span></div><div class="inv-totals-row"><span>Paid</span><span>' + formatMoney(order.paid) + '</span></div><div class="inv-totals-row" style="color:var(--danger); font-weight:700;"><span>Balance</span><span>' + formatMoney(order.balance) + '</span></div></div></div><div class="inv-footer">Thank you for choosing ' + state.settings.shopName + '.</div></div>';
  $('printArea').innerHTML = html;
  $('modalBox').className = 'modal-content wide';
  $('modalBox').innerHTML = '<div class="modal-header"><h3>Invoice #' + order.invNo + '</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body" style="background: var(--bg); overflow-x: auto;">' + html + '</div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="window.print()">Print</button><button class="btn btn-success" onclick="closeModal(); showWhatsAppSuccess({id:\'' + order.id + '\', customerName:\'' + order.customerName + '\'})">WhatsApp</button></div>';
  $('modal').classList.add('active'); if (autoPrint) setTimeout(function() { window.print(); }, 500);
}

function renderItems() {
  var html = ''; for(var i=0; i<state.items.length; i++) { var it = state.items[i]; html += '<tr><td><strong>' + it.name + '</strong></td><td style="direction:rtl;">' + (it.ar || '—') + '</td><td>' + formatMoney(it.wash) + '</td><td>' + formatMoney(it.iron) + '</td><td>' + formatMoney(it.dry) + '</td><td><button class="btn-icon" onclick="openItemModal(\'' + it.id + '\')">✏</button><button class="btn-icon" style="color:var(--danger);" onclick="deleteItem(\'' + it.id + '\')">🗑</button></td></tr>'; }
  $('view-items').innerHTML = '<div class="card"><div class="card-header"><h2>Items & Prices</h2><button class="btn btn-primary btn-sm" onclick="openItemModal()">+ Add Item</button></div><div class="table-responsive"><table><thead><tr><th>Item</th><th>Arabic</th><th>Wash</th><th>Iron</th><th>Dry Clean</th><th>Actions</th></tr></thead><tbody>' + html + '</tbody></table></div></div>';
}
function openItemModal(id) {
  var item = { name: '', ar: '', wash: '', iron: '', dry: '', img: '' }; if (id) { for(var i=0; i<state.items.length; i++) { if(state.items[i].id === id) { item = state.items[i]; break; } } } id = id || '';
  $('modalBox').className = 'modal-content';
  $('modalBox').innerHTML = '<div class="modal-header"><h3>' + (id ? 'Edit Item' : 'Add New Item') + '</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="grid-2"><div class="field"><label>Name (English)</label><input type="text" id="itmName" value="' + item.name + '"></div><div class="field"><label>Name (Arabic)</label><input type="text" id="itmAr" value="' + item.ar + '" style="direction:rtl;"></div></div><div class="grid-3"><div class="field"><label>Wash Price</label><input type="number" id="itmWash" value="' + item.wash + '" step="0.001"></div><div class="field"><label>Iron Price</label><input type="number" id="itmIron" value="' + item.iron + '" step="0.001"></div><div class="field"><label>Dry Clean</label><input type="number" id="itmDry" value="' + item.dry + '" step="0.001"></div></div><div class="field"><label>Item Image</label><input type="file" accept="image/*" onchange="previewItemImage(this)"><div id="itemImgPreview" style="margin-top: 10px;">' + (item.img ? '<img src="' + item.img + '" style="height: 50px; border-radius: 4px;">' : '') + '</div></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveItem(\'' + id + '\')">Save Item</button></div>';
  $('modal').classList.add('active');
}
var tempItemImg = null;
function previewItemImage(input) { if (input.files && input.files[0]) { var reader = new FileReader(); reader.onload = function(e) { tempItemImg = e.target.result; $('itemImgPreview').innerHTML = '<img src="' + tempItemImg + '" style="height: 50px; border-radius: 4px;">'; }; reader.readAsDataURL(input.files[0]); } }
function saveItem(id) {
  var name = $('itmName').value.trim(); if (!name) return showToast('Name required', 'error');
  var data = { name: name, ar: $('itmAr').value.trim(), wash: parseFloat($('itmWash').value) || 0, iron: parseFloat($('itmIron').value) || 0, dry: parseFloat($('itmDry').value) || 0, img: tempItemImg || (id ? getItemImg(id) : '') };
  if (id) { for(var i=0; i<state.items.length; i++) { if(state.items[i].id === id) { state.items[i].name = data.name; state.items[i].ar = data.ar; state.items[i].wash = data.wash; state.items[i].iron = data.iron; state.items[i].dry = data.dry; state.items[i].img = data.img; break; } } } else { data.id = generateId(); state.items.push(data); }
  tempItemImg = null; saveState(); closeModal(); renderItems(); showToast('Item saved');
}
function getItemImg(id) { for(var i=0; i<state.items.length; i++) { if(state.items[i].id === id) return state.items[i].img; } return ''; }
function deleteItem(id) { if (!confirm('Delete this item?')) return; var newItems = []; for(var i=0; i<state.items.length; i++) { if(state.items[i].id !== id) newItems.push(state.items[i]); } state.items = newItems; saveState(); renderItems(); }

function renderCustomers() {
  var html = ''; for(var i=0; i<state.customers.length; i++) { var c = state.customers[i]; var bal = 0; var count = 0; for(var j=0; j<state.orders.length; j++) { if(state.orders[j].customerId === c.id) { bal += (state.orders[j].balance || 0); count++; } } html += '<tr><td><strong>' + c.name + '</strong></td><td>' + c.phone + '</td><td>' + count + '</td><td style="color:' + (bal > 0 ? 'var(--danger)' : 'var(--success)') + '; font-weight:600;">' + formatMoney(bal) + '</td></tr>'; }
  if(html === '') html = '<tr><td colspan="4" style="text-align:center;">No customers yet.</td></tr>';
  $('view-customers').innerHTML = '<div class="card"><div class="card-header"><h2>Customers</h2><button class="btn btn-primary btn-sm" onclick="openCustomerModal()">+ Add Customer</button></div><div class="table-responsive"><table><thead><tr><th>Name</th><th>Phone</th><th>Total Orders</th><th>Balance</th></tr></thead><tbody>' + html + '</tbody></table></div></div>';
}
function openCustomerModal() {
  $('modalBox').className = 'modal-content';
  $('modalBox').innerHTML = '<div class="modal-header"><h3>Add Customer</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="field"><label>Name</label><input type="text" id="cName"></div><div class="field"><label>Phone (WhatsApp)</label><input type="text" id="cPhone" placeholder="+973 3300 0000"></div><div class="field"><label>Address</label><input type="text" id="cAddress"></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCustomer()">Save</button></div>';
  $('modal').classList.add('active');
}
function saveCustomer() {
  var name = $('cName').value.trim(); var phone = $('cPhone').value.trim(); if (!name) return showToast('Name required', 'error');
  var newCust = { id: generateId(), name: name, phone: phone, address: $('cAddress').value.trim() }; state.customers.push(newCust); saveState(); closeModal();
  if (curView === 'pos') { renderPOS(); $('posCustomer').value = newCust.id; selectCustomer(newCust.id); showToast('Customer added'); } else { renderCustomers(); showToast('Customer added'); }
}

function renderExpenses() {
  var html = ''; var rev = state.expenses.slice().reverse(); var total = 0;
  for(var i=0; i<rev.length; i++) { var e = rev[i]; total += e.amount; html += '<tr><td>' + e.date + '</td><td><strong>' + e.title + '</strong></td><td style="color:var(--danger); font-weight:600;">' + formatMoney(e.amount) + '</td><td><button class="btn-icon" onclick="deleteExpense(\'' + e.id + '\')">🗑</button></td></tr>'; }
  if(html === '') html = '<tr><td colspan="4" style="text-align:center;">No expenses recorded.</td></tr>';
  $('view-expenses').innerHTML = '<div class="card"><div class="card-header"><h2>Add Expense</h2></div><div class="card-body"><div class="grid-2"><div class="field"><label>Expense Title</label><input type="text" id="expTitle" placeholder="e.g. Surf, Chai"></div><div class="field"><label>Amount</label><input type="number" id="expAmount" step="0.001"></div></div><button class="btn btn-primary" onclick="addExpense()">Add Expense</button></div></div><div class="card"><div class="card-header"><h2>Expense History (' + formatMoney(total) + ')</h2></div><div class="table-responsive"><table><thead><tr><th>Date</th><th>Title</th><th>Amount</th><th>Action</th></tr></thead><tbody>' + html + '</tbody></table></div></div>';
}
function addExpense() { var title = $('expTitle').value.trim(); var amount = parseFloat($('expAmount').value) || 0; if(!title || amount <= 0) return showToast('Invalid entry', 'error'); state.expenses.push({ id: generateId(), title: title, amount: amount, date: todayISO() }); saveState(); renderExpenses(); showToast('Expense added'); }
function deleteExpense(id) { if(!confirm('Delete this expense?')) return; var newExp = []; for(var i=0; i<state.expenses.length; i++) { if(state.expenses[i].id !== id) newExp.push(state.expenses[i]); } state.expenses = newExp; saveState(); renderExpenses(); }

function renderReports() {
  var thisMonth = new Date().toISOString().slice(0,7); var monthSales = 0, monthExpenses = 0;
  for(var i=0; i<state.orders.length; i++) { if(state.orders[i].date.indexOf(thisMonth) === 0 && state.orders[i].status !== 'Cancelled') { monthSales += state.orders[i].total; } }
  for(var i=0; i<state.expenses.length; i++) { if(state.expenses[i].date.indexOf(thisMonth) === 0) { monthExpenses += state.expenses[i].amount; } }
  $('view-reports').innerHTML = '<div class="stats-grid"><div class="stat-card purple"><div class="stat-icon">📈</div><div class="stat-info"><h3>Month Sales</h3><h2>' + formatMoney(monthSales) + '</h2></div></div><div class="stat-card orange"><div class="stat-icon">💸</div><div class="stat-info"><h3>Month Expenses</h3><h2>' + formatMoney(monthExpenses) + '</h2></div></div><div class="stat-card green"><div class="stat-icon">💰</div><div class="stat-info"><h3>Net Profit</h3><h2>' + formatMoney(monthSales - monthExpenses) + '</h2></div></div></div>';
}

function renderSettings() {
  $('view-settings').innerHTML = '<div class="card"><div class="card-header"><h2>Shop Settings</h2></div><div class="card-body"><div class="grid-2"><div class="field"><label>Shop Name</label><input type="text" id="setName" value="' + state.settings.shopName + '"></div><div class="field"><label>Phone</label><input type="text" id="setPhone" value="' + state.settings.phone + '"></div></div><div class="field"><label>Address</label><input type="text" id="setAddr" value="' + state.settings.address + '"></div><div class="grid-2"><div class="field"><label>Currency</label><input type="text" id="setCur" value="' + state.settings.currency + '"></div><div class="field"><label>Admin PIN</label><input type="text" id="setPin" value="' + state.settings.pin + '"></div></div><div class="field"><label>Shop Logo</label><button class="btn btn-secondary" onclick="document.getElementById(\'globalLogoUpload\').click()">Upload Logo</button>' + (state.settings.logo ? '<button class="btn btn-danger btn-sm" style="margin-left:8px;" onclick="removeLogo()">Remove</button>' : '') + '</div><button class="btn btn-primary" onclick="saveSettings()" style="margin-top:16px;">Save Settings</button></div></div><div class="card"><div class="card-header"><h2>Backup & Restore</h2></div><div class="card-body"><div style="display:flex; gap:10px; flex-wrap:wrap;"><button class="btn btn-secondary" onclick="backupData()">Download Backup (JSON)</button><button class="btn btn-secondary" onclick="document.getElementById(\'importFile\').click()">Import Backup</button></div></div></div>';
}
function saveSettings() { state.settings.shopName = $('setName').value; state.settings.phone = $('setPhone').value; state.settings.address = $('setAddr').value; state.settings.currency = $('setCur').value; state.settings.pin = $('setPin').value; saveState(); $('sidebarShopName').textContent = state.settings.shopName; showToast('Settings saved'); }
function uploadLogo(input) { if (input.files && input.files[0]) { var reader = new FileReader(); reader.onload = function(e) { state.settings.logo = e.target.result; saveState(); if (document.querySelector('#view-settings')) renderSettings(); showToast('Logo updated'); }; reader.readAsDataURL(input.files[0]); } }
function removeLogo() { state.settings.logo = ''; saveState(); renderSettings(); }
function backupData() { var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state)); var dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr); dlAnchorElem.setAttribute("download", "fcl_backup_" + todayISO() + ".json"); dlAnchorElem.click(); showToast('Backup downloaded'); }
function importData(input) { if (input.files && input.files[0]) { var reader = new FileReader(); reader.onload = function(e) { try { var parsed = JSON.parse(e.target.result); if (parsed.settings && parsed.items) { state = parsed; saveState(); showToast('Data restored'); location.reload(); } else { showToast('Invalid file', 'error'); } } catch(err) { showToast('Error', 'error'); } }; reader.readAsText(input.files[0]); } }
function closeModal() { $('modal').classList.remove('active'); }

document.addEventListener('DOMContentLoaded', function() {
  var pinInput = $('pinInput');
  if(pinInput) { pinInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') handleLogin(); }); }

  // === KEYBOARD SHORTCUTS (SAAS FEATURE) ===
  document.addEventListener('keydown', function(e) {
    // F2 for New Bill
    if (e.key === 'F2') {
      e.preventDefault();
      if ($('app').style.display !== 'none') navTo('pos');
    }
    // Ctrl + Enter to Save Bill
    if (e.ctrlKey && e.key === 'Enter') {
      if (curView === 'pos') {
        e.preventDefault();
        saveOrder(false, false);
      }
    }
    // Escape to close modal
    if (e.key === 'Escape') {
      closeModal();
    }
  });
});
</script>
</body>
</html>
